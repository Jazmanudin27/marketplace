<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Skema Wiring Diagram ESP32 Solenoid Valve 12V HD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: #090d16;
    color: #e2e8f0;
    width: 1920px;
    height: 1080px;
    padding: 30px 40px;
    margin: 0 auto;
    overflow: hidden;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    border: 2px solid #3b82f6;
    border-radius: 16px;
    padding: 16px 30px;
    margin-bottom: 20px;
  }
  .title h1 {
    font-size: 28px;
    font-weight: 800;
    color: #38bdf8;
  }
  .title p {
    font-size: 15px;
    color: #94a3b8;
  }
  .wire-legend {
    display: flex;
    gap: 20px;
    background: #1e293b;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-line { width: 26px; height: 6px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="header-bar">
    <div class="title">
      <h1>SKEMA DIAGRAM PENGKABELAN (WIRING DIAGRAM) IoT ESP32 & SOLENOID VALVE 12V</h1>
      <p>Power Supply Switching 12V &bull; Step-Down LM2596 (Set 5.0V) &bull; ESP32 DevKit V1 &bull; Modul Relay 5V 2-CH &bull; Solenoid 12V</p>
    </div>
    <div class="wire-legend">
      <div class="legend-item"><div class="legend-line" style="background:#ef4444;"></div> +12V DC</div>
      <div class="legend-item"><div class="legend-line" style="background:#f97316;"></div> +5V DC</div>
      <div class="legend-item"><div class="legend-line" style="background:#38bdf8;"></div> GPIO D4 Control</div>
      <div class="legend-item"><div class="legend-line" style="background:#64748b;"></div> GND (Common 0V)</div>
      <div class="legend-item"><div class="legend-line" style="background:#a855f7;"></div> 220V AC PLN</div>
    </div>
  </div>

  <svg width="1840" height="920" viewBox="0 0 1840 920" style="background:#070b13; border-radius:16px; border:2px solid #2563eb;">
    <defs>
      <linearGradient id="psuGradL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="espGradL" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#090d16"/>
      </linearGradient>
      <linearGradient id="relayGradL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0284c7"/>
        <stop offset="100%" stop-color="#075985"/>
      </linearGradient>
      <linearGradient id="stepGradL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e40af"/>
        <stop offset="100%" stop-color="#1e3a8a"/>
      </linearGradient>
      <linearGradient id="valveGradL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#475569"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      
      <filter id="glowRedL" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.8"/>
      </filter>
      <filter id="glowOrangeL" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f97316" flood-opacity="0.8"/>
      </filter>
      <filter id="glowBlueL" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.8"/>
      </filter>

      <pattern id="diagGridL" width="25" height="25" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#172033" />
      </pattern>
    </defs>

    <rect width="1840" height="920" fill="url(#diagGridL)" />

    <!-- 1. POWER SUPPLY SWITCHING 12V -->
    <g transform="translate(60, 100)">
      <rect width="320" height="380" rx="14" fill="url(#psuGradL)" stroke="#64748b" stroke-width="3"/>
      <rect x="25" y="25" width="270" height="150" rx="8" fill="#0b1120" stroke="#334155"/>
      <text x="160" y="75" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle">POWER SUPPLY 12V</text>
      <text x="160" y="105" fill="#38bdf8" font-size="16" font-weight="600" text-anchor="middle">Switching PSU Jaring</text>
      <text x="160" y="135" fill="#94a3b8" font-size="13" text-anchor="middle">Input 220V AC ➔ Output 12V DC</text>

      <rect x="20" y="210" width="280" height="145" rx="10" fill="#020617" stroke="#475569" stroke-width="2"/>

      <circle cx="45" cy="250" r="12" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
      <text x="45" y="298" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">L</text>
      <text x="45" y="320" fill="#64748b" font-size="12" text-anchor="middle">Phase</text>

      <circle cx="95" cy="250" r="12" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
      <text x="95" y="298" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">N</text>
      <text x="95" y="320" fill="#64748b" font-size="12" text-anchor="middle">Neutral</text>

      <circle cx="145" cy="250" r="12" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
      <text x="145" y="298" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle">FG</text>
      <text x="145" y="320" fill="#64748b" font-size="12" text-anchor="middle">Earth</text>

      <circle cx="200" cy="250" r="13" fill="#0f172a" stroke="#94a3b8" stroke-width="3.5"/>
      <text x="200" y="298" fill="#cbd5e1" font-size="17" font-weight="bold" text-anchor="middle">-V</text>
      <text x="200" y="320" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">GND 12V</text>

      <circle cx="260" cy="250" r="13" fill="#7f1d1d" stroke="#ef4444" stroke-width="3.5"/>
      <text x="260" y="298" fill="#f87171" font-size="17" font-weight="bold" text-anchor="middle">+V</text>
      <text x="260" y="320" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">+12V DC</text>
    </g>

    <!-- Steker PLN Box -->
    <g transform="translate(60, 540)">
      <rect width="180" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="90" y="35" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">STEKER PLN</text>
      <text x="90" y="58" fill="#a855f7" font-size="13" font-weight="600" text-anchor="middle">AC 220V</text>
      <path d="M 90 0 L 90 -160 L 105 -160" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="6,4"/>
      <path d="M 130 0 L 130 -160 L 155 -160" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="6,4"/>
    </g>

    <!-- 2. STEP-DOWN LM2596 -->
    <g transform="translate(480, 100)">
      <rect width="280" height="220" rx="12" fill="url(#stepGradL)" stroke="#38bdf8" stroke-width="3"/>
      <text x="140" y="35" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">STEP-DOWN LM2596</text>
      <text x="140" y="58" fill="#93c5fd" font-size="13" text-anchor="middle">Turunkan 12V ➔ 5.0V DC</text>

      <!-- Trimpot -->
      <rect x="175" y="120" width="75" height="50" rx="6" fill="#15803d" stroke="#fef08a" stroke-width="2.5"/>
      <circle cx="230" cy="145" r="10" fill="#eab308" stroke="#713f12" stroke-width="2"/>
      <line x1="222" y1="145" x2="238" y2="145" stroke="#451a03" stroke-width="3"/>
      <text x="212" y="190" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">Trimpot Set 5V</text>

      <!-- IN Terminals -->
      <circle cx="24" cy="95" r="11" fill="#7f1d1d" stroke="#f87171" stroke-width="3"/>
      <text x="45" y="101" fill="#fca5a5" font-size="15" font-weight="bold">IN+</text>
      <text x="45" y="116" fill="#ef4444" font-size="11">(12V)</text>

      <circle cx="24" cy="165" r="11" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
      <text x="45" y="171" fill="#cbd5e1" font-size="15" font-weight="bold">IN-</text>
      <text x="45" y="186" fill="#94a3b8" font-size="11">(GND)</text>

      <!-- OUT Terminals -->
      <circle cx="256" cy="95" r="11" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/>
      <text x="190" y="101" fill="#fdba74" font-size="15" font-weight="bold">OUT+</text>
      <text x="196" y="116" fill="#f97316" font-size="11">(+5V)</text>

      <circle cx="256" cy="165" r="11" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
      <text x="190" y="171" fill="#cbd5e1" font-size="15" font-weight="bold">OUT-</text>
      <text x="196" y="186" fill="#94a3b8" font-size="11">(GND)</text>
    </g>

    <!-- 3. ESP32 DEVKIT V1 -->
    <g transform="translate(850, 70)">
      <rect x="-20" y="-15" width="360" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="-8" y1="10" x2="-8" y2="480" stroke="#ef4444" stroke-width="3.5"/>
      <line x1="328" y1="10" x2="328" y2="480" stroke="#3b82f6" stroke-width="3.5"/>

      <rect width="320" height="480" rx="14" fill="url(#espGradL)" stroke="#475569" stroke-width="2.5"/>
      
      <!-- Shield Centered (w:120, centered at x=100) -->
      <rect x="100" y="40" width="120" height="150" rx="8" fill="#334155" stroke="#94a3b8"/>
      <text x="160" y="105" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle">ESP-WROOM-32</text>
      <text x="160" y="132" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">DevKit V1 (30-Pin)</text>

      <!-- USB -->
      <rect x="125" y="440" width="70" height="38" rx="4" fill="#64748b" stroke="#cbd5e1"/>
      <text x="160" y="464" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">USB PORT</text>

      <!-- D4 Pin -->
      <rect x="0" y="275" width="95" height="38" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="8" cy="294" r="7.5" fill="#38bdf8"/>
      <text x="20" y="300" fill="#ffffff" font-size="15" font-weight="bold">D4 (G4)</text>
      <text x="18" y="328" fill="#38bdf8" font-size="11" font-weight="bold">GPIO CONTROL</text>

      <!-- VIN Pin -->
      <rect x="225" y="40" width="95" height="36" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="2.5"/>
      <circle cx="312" cy="58" r="7.5" fill="#fb923c"/>
      <text x="235" y="64" fill="#ffedd5" font-size="15" font-weight="bold">VIN (5V)</text>

      <!-- GND Pin -->
      <rect x="225" y="95" width="95" height="36" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="312" cy="113" r="7.5" fill="#cbd5e1"/>
      <text x="245" y="119" fill="#f8fafc" font-size="15" font-weight="bold">GND</text>
    </g>

    <!-- 4. MODUL RELAY 2-CH 5V -->
    <g transform="translate(1310, 70)">
      <rect width="320" height="380" rx="14" fill="#0b1120" stroke="#0284c7" stroke-width="3"/>
      <text x="160" y="35" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle">MODUL RELAY 2-CH 5V</text>

      <!-- Relay 1 Cube -->
      <rect x="25" y="55" width="130" height="150" rx="8" fill="url(#relayGradL)" stroke="#38bdf8" stroke-width="2"/>
      <text x="90" y="100" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">RELAY 1</text>
      <text x="90" y="125" fill="#bae6fd" font-size="13" text-anchor="middle">SONGLE 10A</text>
      <text x="90" y="150" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="middle">(AKTIF)</text>

      <!-- Relay 2 Cube -->
      <rect x="165" y="55" width="130" height="150" rx="8" fill="#075985" stroke="#0369a1" stroke-width="1.5"/>
      <text x="230" y="100" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle">RELAY 2</text>
      <text x="230" y="125" fill="#64748b" font-size="13" text-anchor="middle">(Cadangan)</text>

      <!-- Screw Terminals Relay 1 -->
      <rect x="20" y="220" width="140" height="60" rx="8" fill="#020617" stroke="#334155" stroke-width="2"/>
      <circle cx="42" cy="250" r="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
      <text x="42" y="295" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle">NO</text>
      <text x="42" y="312" fill="#f87171" font-size="11" text-anchor="middle">Kran Air</text>

      <circle cx="90" cy="250" r="10" fill="#7c2d12" stroke="#f97316" stroke-width="3"/>
      <text x="90" y="295" fill="#fdba74" font-size="14" font-weight="bold" text-anchor="middle">COM</text>
      <text x="90" y="312" fill="#fb923c" font-size="11" text-anchor="middle">+12V In</text>

      <circle cx="138" cy="250" r="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <text x="138" y="295" fill="#64748b" font-size="14" font-weight="bold" text-anchor="middle">NC</text>

      <!-- Input Pins Header (Labels on top, Pins below) -->
      <rect x="45" y="315" width="230" height="52" rx="8" fill="#1e293b" stroke="#475569"/>
      
      <text x="75" y="336" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">GND</text>
      <circle cx="75" cy="354" r="6" fill="#cbd5e1"/>

      <text x="125" y="336" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">IN1</text>
      <circle cx="125" cy="354" r="6" fill="#38bdf8"/>

      <text x="175" y="336" fill="#64748b" font-size="12" text-anchor="middle">IN2</text>
      <circle cx="175" cy="354" r="5" fill="#475569"/>

      <text x="225" y="336" fill="#fb923c" font-size="12" font-weight="bold" text-anchor="middle">VCC</text>
      <circle cx="225" cy="354" r="6" fill="#fb923c"/>
    </g>

    <!-- 5. SOLENOID VALVE 12V -->
    <g transform="translate(1310, 530)">
      <rect width="320" height="270" rx="14" fill="url(#valveGradL)" stroke="#94a3b8" stroke-width="2.5"/>
      <text x="160" y="40" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle">SOLENOID VALVE 12V</text>
      <text x="160" y="65" fill="#38bdf8" font-size="13" text-anchor="middle">Kran Air Elektrik (Normally Closed)</text>

      <rect x="100" y="90" width="120" height="100" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
      <circle cx="160" cy="140" r="30" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>

      <!-- Pipes -->
      <rect x="20" y="115" width="80" height="40" fill="#cbd5e1" stroke="#475569"/>
      <text x="60" y="140" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">MASUK</text>

      <rect x="220" y="115" width="80" height="40" fill="#cbd5e1" stroke="#475569"/>
      <text x="260" y="140" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">KELUAR</text>

      <!-- Terminals -->
      <rect x="75" y="205" width="60" height="35" rx="5" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
      <circle cx="105" cy="222" r="6" fill="#fca5a5"/>
      <text x="105" y="258" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">Pin 1 (NO)</text>

      <rect x="185" y="205" width="60" height="35" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="215" cy="222" r="6" fill="#cbd5e1"/>
      <text x="215" y="258" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle">Pin 2 (GND)</text>
    </g>

    <!-- WIRING BUS LINES -->
    <!-- 1. +12V DC (RED) -->
    <path d="M 320 350 L 410 350 L 410 195 L 504 195" fill="none" stroke="#ef4444" stroke-width="5" filter="url(#glowRedL)"/>
    <circle cx="410" cy="350" r="5" fill="#ef4444"/>

    <path d="M 410 350 L 410 570 L 1250 570 L 1250 320 L 1400 320" fill="none" stroke="#ef4444" stroke-width="5"/>
    <rect x="680" y="555" width="360" height="30" rx="6" fill="#1e1523" stroke="#ef4444" stroke-width="1.2"/>
    <text x="860" y="575" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle">Jalur Kabel +12V DC (Ke Step-Down & COM Relay)</text>

    <!-- 2. GND 12V (GRAY) -->
    <path d="M 260 350 L 260 410 L 430 410 L 430 265 L 504 265" fill="none" stroke="#64748b" stroke-width="5"/>
    <circle cx="260" cy="410" r="5" fill="#64748b"/>

    <path d="M 260 410 L 260 870 L 1525 870 L 1525 752" fill="none" stroke="#64748b" stroke-width="5"/>
    <rect x="670" y="855" width="380" height="30" rx="6" fill="#0d1424" stroke="#64748b" stroke-width="1.2"/>
    <text x="860" y="875" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">Jalur Common Ground / -V 12V (Ke Solenoid Pin 2)</text>

    <!-- 3. +5V DC (ORANGE) -->
    <path d="M 736 195 L 800 195 L 800 25 L 1162 25 L 1162 128" fill="none" stroke="#f97316" stroke-width="5" filter="url(#glowOrangeL)"/>
    <circle cx="1000" cy="25" r="6" fill="#f97316"/>

    <path d="M 1000 25 L 1720 25 L 1720 440 L 1535 440 L 1535 424" fill="none" stroke="#f97316" stroke-width="5"/>
    <rect x="880" y="12" width="240" height="28" rx="6" fill="#2d1305" stroke="#f97316" stroke-width="1.2"/>
    <text x="1000" y="31" fill="#fdba74" font-size="14" font-weight="bold" text-anchor="middle">+5V DC (Ke VIN ESP32 & VCC Relay)</text>

    <!-- 4. GND 5V (LOGIC GND) -->
    <path d="M 736 265 L 820 265 L 820 45 L 1145 45 L 1145 183 L 1162 183" fill="none" stroke="#475569" stroke-width="5"/>
    <circle cx="980" cy="45" r="5" fill="#475569"/>

    <path d="M 980 45 L 1310 45 L 1310 440 L 1385 440 L 1385 424" fill="none" stroke="#475569" stroke-width="5"/>

    <!-- 5. GPIO D4 CONTROL (BLUE) -->
    <path d="M 850 364 L 820 364 L 820 500 L 1435 500 L 1435 424" fill="none" stroke="#38bdf8" stroke-width="5.5" filter="url(#glowBlueL)"/>
    <rect x="960" y="485" width="370" height="30" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1145" y="505" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Sinyal Logika Kontrol: Pin D4 (GPIO 4) ➔ Relay IN1</text>

    <!-- 6. BEBAN SOLENOID VALVE -->
    <path d="M 1352 320 L 1352 460 L 1270 460 L 1270 700 L 1415 700 L 1415 735" fill="none" stroke="#f43f5e" stroke-width="5"/>
    <rect x="1205" y="685" width="160" height="28" rx="5" fill="#4c0519" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="1285" y="704" fill="#fda4af" font-size="13" font-weight="bold" text-anchor="middle">Relay NO ➔ Kran Air</text>

  </svg>
</body>
</html>
